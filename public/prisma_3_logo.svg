<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradient for letter A -->
    <linearGradient id="gradientA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtle inner shadow gradient for A -->
    <linearGradient id="gradientAInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#050B16" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050B16" stop-opacity="0.2" />
    </linearGradient>

    <!-- Gradient for 3.0 -->
    <linearGradient id="gradient30" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#60A5FA" />
      <stop offset="70%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 15)">
    <!-- PRISM Text -->
    <text
      x="0"
      y="125"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Segoe UI', sans-serif"
      font-size="142"
      font-weight="900"
      letter-spacing="0.04em"
    >PRISM</text>

    <!-- Stylized Delta "A" matching Reference 1 -->
    <!-- Positioned precisely after M -->
    <g transform="translate(535, 10)">
      <!-- Outer Delta Triangle with gradient -->
      <path
        d="M 58 10 L 116 115 L 0 115 Z"
        fill="url(#gradientA)"
      />
      <!-- Inner cutout creating the crossbar opening -->
      <path
        d="M 58 52 L 88 115 L 28 115 Z"
        fill="#050B16"
      />
      <!-- Subtle internal bottom tint -->
      <path
        d="M 58 52 L 88 115 L 28 115 Z"
        fill="url(#gradientAInner)"
      />
    </g>

    <!-- 3.0 Text with Gradient -->
    <text
      x="675"
      y="125"
      fill="url(#gradient30)"
      font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Segoe UI', sans-serif"
      font-size="142"
      font-weight="900"
      letter-spacing="0.02em"
    >3.0</text>
  </g>
</svg>
